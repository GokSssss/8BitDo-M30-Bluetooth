plugins { id 'com.android.application' }
def previewMode = project.findProperty('m30Preview') == 'true'
android {
    namespace 'app.m30.companion'
    compileSdk 35
    defaultConfig {
        applicationId (previewMode ? 'app.m30.companion.preview' : 'app.m30.companion')
        minSdk 26
        targetSdk 35
        versionCode 61
        versionName (previewMode ? '1.60-preview' : '1.60')
        manifestPlaceholders = [m30AppLabel: previewMode ? 'M30 Проверка' : 'M30 Companion']
        testInstrumentationRunner 'app.m30.companion.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests.includeAndroidResources = true; unitTests.all { maxHeapSize = "1536m"; jvmArgs "-XX:-UseContainerSupport"; systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"; ["http.proxyHost","http.proxyPort","https.proxyHost","https.proxyPort","javax.net.ssl.trustStore"].each { key -> if (System.getProperty(key)) systemProperty key, System.getProperty(key) } } }
    // Stable main key is explicitly approved and backed up on Drive; never auto-generate a debug key.
    def m30Store = System.getenv(previewMode ? 'M30_PREVIEW_SIGNING_STORE' : 'M30_SIGNING_STORE')
    signingConfigs {
        original {
            if (m30Store) {
                storeFile file(m30Store)
                storePassword System.getenv(previewMode ? 'M30_PREVIEW_STORE_PASSWORD' : 'M30_STORE_PASSWORD')
                keyAlias System.getenv(previewMode ? 'M30_PREVIEW_KEY_ALIAS' : 'M30_KEY_ALIAS')
                keyPassword System.getenv(previewMode ? 'M30_PREVIEW_KEY_PASSWORD' : 'M30_KEY_PASSWORD')
            }
        }
    }
    buildTypes { debug { signingConfig m30Store ? signingConfigs.original : null } }
}

// Keep the established SDK35 app target. Isolate the public API37 call behind a runtime guard.
def bluetooth37Compile = tasks.register('compileBluetooth37', JavaCompile) {
    source = fileTree('src/api37/java') { include '**/*.java' }
    classpath = files(System.getenv('M30_ANDROID37_JAR') ?: "${android.sdkDirectory}/platforms/android-37.0/android.jar")
    options.release = 8
    destinationDirectory = layout.buildDirectory.dir('classes/bluetooth37')
}
def bluetooth37Jar = tasks.register('bluetooth37Jar', Jar) {
    dependsOn bluetooth37Compile
    archiveFileName = 'bluetooth37.jar'
    destinationDirectory = layout.buildDirectory.dir('libs')
    from bluetooth37Compile.flatMap { it.destinationDirectory }
}
dependencies { implementation files(bluetooth37Jar) }

dependencies { testImplementation "junit:junit:4.13.2"; testImplementation "org.robolectric:robolectric:4.14.1" }
